version: 2

models:
  - name: agg_etablissements_par_region_2023
    columns:
      - name: region
        data_tests: [not_null]
      - name: nb_etablissements
        data_tests: [not_null]

  - name: agg_hopitaux_par_region
    columns:
      - name: region
        data_tests: [not_null]
      - name: region_code
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_etablissement_education
    description: Tous les établissements d'éducation (8 fichiers), avec la région normalisée et son code.
    columns:
      - name: etablissement
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: region
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: region
      - name: region_code
        data_tests:
          - not_null
      - name: niveau
        data_tests:
          - accepted_values:
              values: ['primaire_public', 'college_public', 'qualifiant_public', 'prive']
      - name: version_source
        data_tests:
          - accepted_values:
              values: ['2023', '2026']

  - name: comparaison_versions_par_region
    description: Écart du nombre d'établissements entre le fichier 2023 et le fichier 2026, par région et par niveau.
    columns:
      - name: region
        data_tests:
          - not_null